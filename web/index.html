<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文明 VI｜AI 決策助手</title><link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div><strong>文明 VI｜AI 決策助手</strong><p>遊戲內按「匯出局勢」，再回來詢問下一步。</p></div><span id="status">讀取中…</span></header>
  <main>
    <aside><h2>本局資料</h2><div id="state">讀取中…</div><button id="refresh">重新讀取</button>
      <p class="hint">每回合或局勢變化後，在遊戲內再按一次「匯出局勢」。助手只看得到模組匯出的可見地塊。</p></aside>
    <section class="chat"><div id="messages" role="log" aria-live="polite"></div>
      <div class="prompts">
        <button data-question="根據文明與領袖特性、當前局勢，建議主副勝利路線和接下來三個優先目標。">勝利路線</button>
        <button data-question="目前開拓者附近有哪些適合建城的可見格？比較座標與待確認條件。">城市落點</button>
        <button data-question="逐城建議下一項生產，說明理由與前置條件。">城市生產</button>
        <button data-question="規劃各城市的區域位置與相鄰布局，標示需在遊戲確認的條件。">區域規劃</button>
        <button data-question="接下來的科技與市政應如何排序？請結合勝利目標說明。">科技市政</button>
      </div>
      <form id="form"><label for="question">你的問題</label><textarea id="question" rows="3" maxlength="4000" placeholder="例如：這座城市先蓋學院還是開拓者？" required></textarea>
        <div class="actions"><label class="attach">附上遊戲截圖<input id="screenshot" type="file" accept="image/*"></label><span id="image-name">也可直接貼上截圖（Ctrl+V）</span><button id="send" type="submit">詢問 AI</button></div>
      </form>
    </section>
  </main><script src="/app.js" defer></script>
</body></html>
